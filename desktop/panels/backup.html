<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' fonts.googleapis.com fonts.gstatic.com">
  <title>AQRTI Backup Center</title>
  <link rel="stylesheet" href="panel-common.css">
  <style>
    .backup-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;margin-bottom:4px;background:var(--bg2);border:1px solid var(--border)}
    .backup-id{flex:1;font-size:0.68rem;color:var(--text)}
    .backup-meta{font-size:0.62rem;color:var(--text3);min-width:90px;text-align:right}
    .backup-actions{display:flex;gap:5px}
    .backup-actions button{font-family:var(--font);font-size:0.6rem;padding:3px 8px;border-radius:4px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--text2);transition:all 0.2s}
    .backup-actions button:hover{color:var(--text);background:rgba(99,102,241,0.1)}
    .backup-actions .del:hover{color:var(--red);background:rgba(239,68,68,0.1)}
    .schedule-info{font-size:0.68rem;color:var(--text2)}
    .empty-state{text-align:center;padding:30px;color:var(--text3);font-size:0.7rem}
    .progress-row{display:flex;align-items:center;gap:10px;padding:8px 0;display:none}
    .progress-track{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
    .progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.3s}
  </style>
</head>
<body>

<div class="titlebar">
  <span class="titlebar-title">◉ Backup Center</span>
  <button class="titlebar-close" onclick="window.close()">✕</button>
</div>

<div class="content">

  <!-- Create backup -->
  <div class="card">
    <div class="card-title">Create Backup</div>
    <div class="row">
      <label>Backup Label</label>
      <input type="text" id="backup-label" value="manual" style="max-width:200px">
    </div>
    <div class="row">
      <label>Include</label>
      <span style="font-size:0.68rem;color:var(--text2)">Database · Historical Vault · ML Models</span>
    </div>
    <div class="progress-row" id="progress-row">
      <span style="font-size:0.68rem;color:var(--text2)">Creating backup...</span>
      <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-primary" onclick="createBackup()">Create Backup Now</button>
    </div>
  </div>

  <!-- Schedule -->
  <div class="card">
    <div class="card-title">Scheduled Backup</div>
    <div class="row">
      <label>Schedule (cron)</label>
      <input type="text" id="backup-schedule" placeholder="0 18 * * 1-5" style="max-width:200px">
      <button class="btn btn-ghost" onclick="saveSchedule()">Save</button>
    </div>
    <div class="row">
      <label style="min-width:auto;color:var(--text3);font-size:0.65rem" id="sched-hint">
        Default: weekdays at 18:00 (0 18 * * 1-5)
      </label>
    </div>
  </div>

  <!-- Backup list -->
  <div class="card">
    <div class="card-title">Backups <span id="backup-count" style="color:var(--text3);font-weight:400"></span></div>
    <div id="backup-list"><div class="empty-state">No backups found.</div></div>
  </div>

</div>
<div id="toast"></div>

<script>
const api = window.aqrti;

async function load() {
  const [backups, schedule] = await Promise.all([
    api.backup.list(),
    api.backup.getSchedule(),
  ]);

  document.getElementById('backup-schedule').value = schedule || '0 18 * * 1-5';
  renderBackups(backups || []);
}

function renderBackups(backups) {
  const list = document.getElementById('backup-list');
  document.getElementById('backup-count').textContent = `(${backups.length})`;

  if (!backups.length) {
    list.innerHTML = '<div class="empty-state">No backups found. Create one above.</div>';
    return;
  }

  list.innerHTML = backups.map(b => `
    <div class="backup-item" id="bk-${b.id}">
      <div>
        <div class="backup-id">${b.id}</div>
        <div style="font-size:0.6rem;color:var(--text3)">${b.items?.join(' · ') || ''}</div>
      </div>
      <div class="backup-meta">
        <div>${b.sizeFormatted || '—'}</div>
        <div>${new Date(b.createdAt).toLocaleDateString()}</div>
      </div>
      <div class="backup-actions">
        <button onclick="verifyBackup('${b.id}')">Verify</button>
        <button onclick="restoreBackup('${b.id}')">Restore</button>
        <button class="del" onclick="deleteBackup('${b.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

async function createBackup() {
  const label = document.getElementById('backup-label').value || 'manual';
  const row = document.getElementById('progress-row');
  const prog = document.getElementById('prog');

  row.style.display = 'flex';
  prog.style.width = '30%';

  const result = await api.backup.create({ label, compress: true });
  prog.style.width = '100%';

  setTimeout(async () => {
    row.style.display = 'none';
    prog.style.width = '0%';
    if (result.ok) {
      toast(`Backup created: ${result.id}`);
    } else {
      toast(result.error || 'Backup failed', true);
    }
    await load();
  }, 500);
}

async function verifyBackup(id) {
  const r = await api.backup.verify(id);
  if (r.ok) {
    toast(`Integrity OK — checksum matches`);
  } else {
    toast(`Integrity FAILED: ${r.error || 'Checksum mismatch'}`, true);
  }
}

async function restoreBackup(id) {
  if (!confirm(`Restore from backup "${id}"?\n\nCurrent data will be replaced. A safety backup will be created first.`)) return;
  const r = await api.backup.restore(id);
  toast(r.ok ? `Restored from ${id}. Please restart AQRTI.` : r.error, !r.ok);
}

async function deleteBackup(id) {
  if (!confirm(`Delete backup "${id}"?`)) return;
  const r = await api.backup.delete(id);
  if (r.ok) {
    document.getElementById('bk-' + id)?.remove();
    toast('Backup deleted');
    await load();
  }
}

async function saveSchedule() {
  const cron = document.getElementById('backup-schedule').value;
  await api.backup.setSchedule(cron);
  toast('Schedule saved');
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => { el.className = ''; }, 3000);
}

load();
</script>
</body>
</html>
